<section id="experience" class="experience-section">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h2 class="section-title">{{ t().experience.title }}</h2>
      <p class="section-subtitle">{{ t().experience.subtitle }}</p>
    </div>

    <div class="experience-grid">
      @for (exp of t().experience.items; track exp.role; let idx = $index) {
        <div class="exp-card glass-card" [attr.data-aos]="idx % 2 === 0 ? 'fade-right' : 'fade-left'">
          <div class="exp-card-body">
            <div class="exp-header">
              <div class="exp-role-box">
                <div class="role-icon"><i class="fa-solid fa-briefcase"></i></div>
                <div>
                  <h3 class="exp-role-title">{{ exp.role }}</h3>
                  <span class="exp-company-name"><i class="fa-solid fa-building"></i> {{ exp.company }}</span>
                </div>
              </div>
              <span class="years-pill"><i class="fa-regular fa-clock"></i> {{ exp.years }}</span>
            </div>

            <p class="exp-description">{{ exp.desc }}</p>

            <button class="btn-show-more" (click)="openDetails(exp)">
              <i class="fa-solid fa-circle-info"></i>
              <span>{{ t().experience.showDetails }}</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>

@defer (when isModalOpen) {
  <app-details-modal [item]="selectedItem" [isOpen]="isModalOpen" (close)="isModalOpen = false"></app-details-modal>
}
