<section class="testimonials-section section-padding" id="testimonials">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h2 class="section-title"><span class="gradient-text">{{ t().testimonials.title }}</span></h2>
      <p class="section-subtitle">{{ t().testimonials.subtitle }}</p>
    </div>

    <div class="testimonials-grid">
      @for (item of displayTestimonials; track item._id; let idx = $index) {
        <div class="testimonial-card glass-card" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(idx % 3) * 100">
          <div class="testimonial-top">
            <div class="star-rating" title="5 out of 5 stars">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
            </div>
            <i class="fa-solid fa-quote-right quote-watermark"></i>
          </div>

          <p class="testimonial-message">
            "{{ item.message }}"
          </p>

          <div class="testimonial-author">
            @if (item.image) {
              <img [src]="item.image" [alt]="item.name + ' - Review'" width="48" height="48" loading="lazy" decoding="async" class="author-img">
            } @else {
              <div class="author-avatar-fallback">
                <i class="fa-solid fa-user"></i>
              </div>
            }
            <div class="author-info">
              <h4 class="author-name">{{ item.name }}</h4>
              <span class="author-position">{{ item.position }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
