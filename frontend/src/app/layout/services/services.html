<section id="services" class="services-section">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h2 class="section-title">{{ t().services.title }}</h2>
      <p class="section-subtitle">{{ t().services.subtitle }}</p>
    </div>

    <div class="services-grid">
      @for (item of displayedServices; track item.title; let idx = $index) {
        <div class="service-card glass-card" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(idx % 4) * 80">
          <div class="service-icon-box">
            @if (item.icon && item.icon.startsWith('http')) {
              <img [src]="item.icon" [alt]="item.title" class="service-img" />
            } @else if (item.icon) {
              <i [class]="item.icon"></i>
            } @else {
              <i class="fa-solid fa-gears"></i>
            }
          </div>
          <h3 class="service-title">{{ item.title }}</h3>
          <p class="service-desc">{{ item.description }}</p>
        </div>
      }
    </div>

    @if (t().services.items.length > 8) {
      <div class="show-more-container" data-aos="fade-up">
        <button class="btn-gradient show-more-btn" (click)="toggleShowMore()">
          <span>{{ showAllServices ? t().services.showLess : t().services.showMore + ' (' + (t().services.items.length - 8) + '+)' }}</span>
          <i [class]="showAllServices ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'"></i>
        </button>
      </div>
    }
  </div>
</section>
