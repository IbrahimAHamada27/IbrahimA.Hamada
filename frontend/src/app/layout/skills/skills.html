<section id="skills" class="skills-section">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h2 class="section-title">{{ t().skills.title }}</h2>
      <p class="section-subtitle">{{ t().skills.subtitle }}</p>
    </div>

    <div class="skill-categories-container">
      @for (cat of t().skills.categories; track cat.title; let cIdx = $index) {
        <div class="skill-category-block" data-aos="fade-up" [attr.data-aos-delay]="cIdx * 70">
          <div class="category-header">
            <div class="cat-icon-badge">
              <i [class]="cat.icon"></i>
            </div>
            <h3 class="category-heading">{{ cat.title }}</h3>
          </div>

          <div class="skills-grid">
            @for (skill of cat.skills; track skill.name; let sIdx = $index) {
              <div class="skill-card glass-card">
                <div class="skill-icon-box">
                  <i class="fa-solid fa-check-circle text-primary"></i>
                </div>
                <div class="skill-info">
                  <h4 class="skill-name">{{ skill.name }}</h4>
                  <span class="skill-level">{{ skill.level }}</span>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
