<section id="activities" class="activities-section">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h2 class="section-title">{{ t().activities.title }}</h2>
      <p class="section-subtitle">{{ t().activities.subtitle }}</p>
    </div>

    <div class="activities-grid">
      @for (item of t().activities.items; track item.title; let idx = $index) {
        <div class="activity-card glass-card" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(idx % 3) * 100">
          <div class="activity-card-body">
            <div class="activity-header">
              <span class="category-badge" [ngClass]="getCategoryClass(item.category)">
                <i [class]="getCategoryIcon(item.category)"></i> {{ item.category }}
              </span>
              <span class="activity-date"><i class="fa-regular fa-calendar"></i> {{ item.date }}</span>
            </div>

            <h3 class="activity-title">{{ item.title }}</h3>
            <h4 class="activity-org">
              <i class="fa-solid fa-building-flag"></i> {{ item.organization }}
              @if (item.role) {
                <span> • {{ item.role }}</span>
              }
            </h4>

            <p class="activity-desc">{{ item.desc }}</p>

            <button class="btn-show-more" (click)="openDetails(item)">
              <i class="fa-solid fa-circle-info"></i>
              <span>{{ t().activities.showDetails }}</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>

@defer (when isModalOpen) {
  <app-details-modal [item]="selectedItem" [isOpen]="isModalOpen" (close)="isModalOpen = false"></app-details-modal>
}
