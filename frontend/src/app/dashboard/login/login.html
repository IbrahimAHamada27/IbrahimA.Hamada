<div class="login-wrapper">
  <div class="login-backdrop-glow"></div>
  
  <div class="login-card glass-card">
    <div class="login-header">
      <div class="brand-avatar-box">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1 class="login-title">Admin Access Control</h1>
      <p class="login-subtitle">Ibrahim A. Hamada Portfolio Executive Management System</p>
    </div>

    <form class="login-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address / Username</label>
        <div class="input-with-icon">
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="credentials.email" 
            required 
            placeholder="admin@domain.com"
            class="form-input" 
            [disabled]="isLoading"
          />
          <i class="input-icon fa-solid fa-at"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <div class="input-with-icon">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            [(ngModel)]="credentials.password" 
            required 
            placeholder="••••••••••••"
            class="form-input" 
            [disabled]="isLoading"
          />
          <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()">
            <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-login full-width" [disabled]="isLoading">
        @if (isLoading) {
          <i class="fa-solid fa-spinner fa-spin"></i> Authenticating...
        } @else {
          <i class="fa-solid fa-right-to-bracket"></i> Secure Sign In
        }
      </button>
    </form>

    <div class="login-footer">
      <i class="fa-solid fa-shield-halved"></i> 256-bit JWT Encryption Secured Session
    </div>
  </div>
</div>
