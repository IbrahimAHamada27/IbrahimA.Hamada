<div class="dashboard-card">
  <h2><i class="fa-solid fa-briefcase"></i> Experience Management</h2>
  <p>Manage practical work history, QA projects, and web development roles.</p>
  
  <button class="btn-primary" style="margin-bottom: 20px;" (click)="showForm ? cancelEdit() : showForm = true">
    <i [class]="showForm ? 'fa-solid fa-xmark' : 'fa-solid fa-plus'"></i>
    {{ showForm ? 'Cancel' : 'Add New Experience' }}
  </button>

  @if (showForm) {
    <form class="dashboard-form" (submit)="onSubmit($event)">
      <div class="form-group">
        <label><i class="fa-solid fa-user-gear"></i> Role / Title <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="role" [(ngModel)]="formData.role" required class="form-input" placeholder="e.g. Automation Testing Specialist">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-building"></i> Company / Organization <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="company" [(ngModel)]="formData.company" required class="form-input" placeholder="e.g. DeFacto, Noon">
      </div>
      <div class="form-group">
        <label><i class="fa-regular fa-clock"></i> Period / Duration <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="years" [(ngModel)]="formData.years" required class="form-input" placeholder="e.g. Recent / Jan 2025 - Present">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-link"></i> External Link (URL) <span class="optional-badge">Optional</span></label>
        <input type="url" name="link" [(ngModel)]="formData.link" class="form-input" placeholder="https://company-link.com">
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-image"></i> Logo / Banner Image (URL) <span class="optional-badge">Optional</span></label>
        <input type="text" name="imageUrl" [(ngModel)]="formData.imageUrl" class="form-input" placeholder="https://image-url.com/logo.png">
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-align-left"></i> Description <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <textarea name="desc" [(ngModel)]="formData.desc" rows="3" required class="form-input" placeholder="Summary of responsibilities and achievements..."></textarea>
      </div>
      <button type="submit" class="btn-primary full-width">
        <i class="fa-solid fa-check"></i> {{ editingId ? 'Update Experience' : 'Save Experience' }}
      </button>
    </form>
  }

  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>Role</th>
          <th>Company</th>
          <th>Period</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (exp of experiences; track exp._id) {
          <tr>
            <td style="font-weight: 700;">{{ exp.role }}</td>
            <td>{{ exp.company }}</td>
            <td>{{ exp.years }}</td>
            <td>
              <div class="action-btns-cell">
                <button class="btn-warning" (click)="editExperience(exp)"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                <button class="btn-danger" (click)="deleteExperience(exp._id)"><i class="fa-solid fa-trash"></i> Delete</button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" style="text-align: center; padding: 24px;">No experiences found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
