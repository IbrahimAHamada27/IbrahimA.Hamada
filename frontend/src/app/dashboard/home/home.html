<div class="edit-about-container">
  <h2><i class="fa-solid fa-house-laptop"></i> Site & About Information</h2>
  <p>Update personal branding, hero titles, profile picture, and bio content displayed on your portfolio.</p>

  <form (submit)="onSubmit($event)" class="about-form">
    
    <div class="form-section">
      <h3><i class="fa-solid fa-star"></i> Hero Section</h3>
      <div class="form-group">
        <label><i class="fa-solid fa-signature"></i> Brand Name <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="brandName" [(ngModel)]="siteInfo.brandName" required class="form-control" placeholder="e.g. Ibrahim A. Hamada">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-heading"></i> Hero Title <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="heroTitle" [(ngModel)]="siteInfo.heroTitle" required class="form-control" placeholder="e.g. Software Tester & Web Developer">
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-align-left"></i> Brand Tagline <span class="optional-badge">Optional</span></label>
        <textarea name="brandDesc" [(ngModel)]="siteInfo.brandDesc" class="form-control" rows="2" placeholder="Short tagline under brand name..."></textarea>
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-quote-left"></i> Hero Description <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <textarea name="heroDesc" [(ngModel)]="siteInfo.heroDesc" required class="form-control" rows="3" placeholder="Lead paragraph on the hero section..."></textarea>
      </div>
    </div>

    <div class="form-section">
      <h3><i class="fa-solid fa-images"></i> Media & Profile Images</h3>
      <div class="form-group">
        <label><i class="fa-solid fa-upload"></i> Logo Image <span class="optional-badge">Optional</span></label>
        <input type="file" (change)="onLogoSelected($event)" accept="image/*" class="form-control">
        @if (siteInfo.logoImage) {
          <img [src]="siteInfo.logoImage" alt="Logo Preview" class="img-preview" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-top: 8px;">
        }
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-upload"></i> Profile Image <span class="optional-badge">Optional</span></label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="form-control">
        @if (siteInfo.profileImage) {
          <img [src]="siteInfo.profileImage" alt="Profile Preview" class="img-preview" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-top: 8px;">
        }
      </div>
    </div>

    <div class="form-section">
      <h3><i class="fa-solid fa-user"></i> About Me Section</h3>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-pen-nib"></i> About Title <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <input type="text" name="aboutTitle" [(ngModel)]="siteInfo.aboutTitle" required class="form-control" placeholder="Background & Expertise">
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-paragraph"></i> About Bio Paragraph 1 <span class="required-star">*</span> <span class="required-badge">Required</span></label>
        <textarea name="aboutDesc1" [(ngModel)]="siteInfo.aboutDesc1" required class="form-control" rows="3"></textarea>
      </div>
      <div class="form-group full-width">
        <label><i class="fa-solid fa-paragraph"></i> About Bio Paragraph 2 <span class="optional-badge">Optional</span></label>
        <textarea name="aboutDesc2" [(ngModel)]="siteInfo.aboutDesc2" class="form-control" rows="3"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-primary full-width" style="padding: 14px; font-size: 1.05rem;">
      <i class="fa-solid fa-floppy-disk"></i> Save Site Information
    </button>
  </form>
</div>
