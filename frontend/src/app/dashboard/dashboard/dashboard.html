<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="dash-brand">
      <div class="brand-badge"><i class="fa-solid fa-gauge-high"></i></div>
      <span class="brand-title">Admin<span class="gradient-text">Studio</span></span>
    </div>

    <nav class="dash-menu">
      <a routerLink="/admin/home" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-house"></i> <span>Site Information</span>
      </a>
      <a routerLink="/admin/list-projects" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-laptop-code"></i> <span>Projects</span>
      </a>
      <a routerLink="/admin/skills" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-code"></i> <span>Skills & Tools</span>
      </a>
      <a routerLink="/admin/experience" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-briefcase"></i> <span>Experience</span>
      </a>
      <a routerLink="/admin/education" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-graduation-cap"></i> <span>Education</span>
      </a>
      <a routerLink="/admin/certificates" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-certificate"></i> <span>Certificates</span>
      </a>
      <a routerLink="/admin/activities" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-users-gear"></i> <span>Volunteering & Events</span>
      </a>
      <a routerLink="/admin/services" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-gears"></i> <span>Services</span>
      </a>
      <a routerLink="/admin/testimonials" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-quote-right"></i> <span>Testimonials</span>
      </a>
      <a routerLink="/admin/messages" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-envelope"></i> <span>Messages</span>
      </a>
      <a routerLink="/admin/contact" routerLinkActive="active" class="menu-item">
        <i class="fa-solid fa-address-book"></i> <span>Contact Info</span>
      </a>

      <div class="menu-divider"></div>

      <a routerLink="/" class="menu-item back-site-btn">
        <i class="fa-solid fa-arrow-left"></i> <span>Back to Portfolio</span>
      </a>
      <button type="button" class="menu-item logout-btn" (click)="onLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Sign Out</span>
      </button>
    </nav>
  </aside>

  <div class="dash-main">
    <header class="dash-topbar glass-card">
      <div class="topbar-title-box">
        <h2 class="topbar-heading">Portfolio Control Panel</h2>
        <span class="topbar-sub">Manage content, projects, skills, and inbox</span>
      </div>

      <div class="topbar-user">
        <div class="user-avatar">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div class="user-info">
          <span class="user-name">Ibrahim A. Hamada</span>
          <span class="user-role">Administrator</span>
        </div>
        <button type="button" class="btn-topbar-logout" (click)="onLogout()" title="Sign Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="dash-content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
