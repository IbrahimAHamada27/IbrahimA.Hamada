<div class="not-found-container">
  <div class="not-found-card glass-card">
    <div class="not-found-badge">
      <i class="fa-solid fa-triangle-exclamation"></i> Error 404
    </div>
    <h1 class="gradient-text not-found-glitch">404</h1>
    <h2 class="not-found-title">Page Not Found</h2>
    <p class="not-found-desc">The page you are looking for doesn't exist, has been relocated, or is temporarily unavailable.</p>
    <div class="not-found-actions">
      <a [routerLink]="homeLink" class="btn-gradient">
        <i class="fa-solid fa-house"></i>
        <span>{{ homeText }}</span>
      </a>
    </div>
  </div>
</div>
